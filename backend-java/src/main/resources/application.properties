server.port=${SERVER_PORT:5000}
spring.application.name=BulletRaniBackend

# Auth (JWT_SECRET required — no weak default; see SecurityBootstrap)
bulletrani.jwt-secret=${JWT_SECRET}
bulletrani.jwt-days=${JWT_DAYS:7}
bulletrani.cors-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*}

# Socket.IO (netty)
bulletrani.socket-host=${SOCKET_HOST:0.0.0.0}
bulletrani.socket-port=${SOCKET_PORT:5001}

# MongoDB — primary persistence (replaces backend/data/store.json)
bulletrani.mongodb.uri=${MONGODB_URI}
bulletrani.mongodb.database=${MONGODB_DATABASE:bullet_rani}
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:bullet_rani}

# Provider Game SDK
bulletrani.provider.enabled=${PROVIDER_ENABLED:false}
bulletrani.provider.api-url=${PROVIDER_API_URL:}
bulletrani.provider.api-key=${GAME_SERVER_API_KEY:}
bulletrani.provider.table-id=${PROVIDER_TABLE_ID:bulletrani_main}
bulletrani.provider.game-code=${PROVIDER_GAME_CODE:BULLETRANI}

# Operations Launch & Boot (reads INTERNAL_SERVICE_KEY / OPERATIONS_API_URL from .env)
bulletrani.operations.enabled=${OPS_ENABLED:${OPERATIONS_ENABLED:false}}
bulletrani.operations.api-url=${OPERATIONS_API_URL:${OPS_API_URL:}}
bulletrani.operations.internal-key=${INTERNAL_SERVICE_KEY:${OPS_INTERNAL_KEY:}}
bulletrani.operations.launch-url=${OPS_LAUNCH_URL:}
bulletrani.operations.game-code=${OPS_GAME_CODE:BULLETRANI}
bulletrani.operations.gid=${OPS_GID:}
bulletrani.operations.allowed-partner-codes=${OPS_ALLOWED_PARTNERS:}
bulletrani.operations.default-currency=${OPS_DEFAULT_CURRENCY:INR}
bulletrani.operations.default-lang=${OPS_DEFAULT_LANG:en}
bulletrani.operations.default-close-url=${OPS_DEFAULT_CLOSE_URL:}
bulletrani.operations.strict-params=${OPS_STRICT_PARAMS:true}
bulletrani.operations.show-exit-button=${OPS_SHOW_EXIT_BUTTON:true}
bulletrani.operations.retry-count=${OPS_RETRY_COUNT:2}
