server.port=${SERVER_PORT:5000}
spring.application.name=BulletRaniBackend

# Auth (JWT_SECRET required — no weak default; see SecurityBootstrap)
rikshawx.jwt-secret=${JWT_SECRET}
rikshawx.jwt-days=${JWT_DAYS:7}
rikshawx.cors-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*}

# Socket.IO (netty)
rikshawx.socket-host=${SOCKET_HOST:0.0.0.0}
rikshawx.socket-port=${SOCKET_PORT:5001}

# MongoDB — primary persistence (replaces backend/data/store.json)
rikshawx.mongodb.uri=${MONGODB_URI}
rikshawx.mongodb.database=${MONGODB_DATABASE:bullet_rani}
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:bullet_rani}

# Provider Game SDK
rikshawx.provider.enabled=${PROVIDER_ENABLED:false}
rikshawx.provider.api-url=${PROVIDER_API_URL:https://api.dpbossking.com/api/v1}
rikshawx.provider.api-key=${GAME_SERVER_API_KEY:}
rikshawx.provider.table-id=${PROVIDER_TABLE_ID:rikshawx_main}
rikshawx.provider.game-code=${PROVIDER_GAME_CODE:RIKSHAWX}
