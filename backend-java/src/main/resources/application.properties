server.port=${SERVER_PORT:5000}
spring.application.name=BulletRaniBackend

# Auth (JWT_SECRET required — no weak default; see SecurityBootstrap)
bulletrani.jwt-secret=${JWT_SECRET}
bulletrani.jwt-days=${JWT_DAYS:7}
bulletrani.cors-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*}

# Socket.IO (netty)
bulletrani.socket-host=${SOCKET_HOST:0.0.0.0}
bulletrani.socket-port=${SOCKET_PORT:5001}

# MongoDB — primary persistence (replaces backend/data/store.json)
bulletrani.mongodb.uri=${MONGODB_URI}
bulletrani.mongodb.database=${MONGODB_DATABASE:bullet_rani}
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:bullet_rani}

# Provider Game SDK
bulletrani.provider.enabled=${PROVIDER_ENABLED:false}
bulletrani.provider.api-url=${PROVIDER_API_URL:https://api.dpbossking.com/api/v1}
bulletrani.provider.api-key=${GAME_SERVER_API_KEY:}
bulletrani.provider.table-id=${PROVIDER_TABLE_ID:bulletrani_main}
bulletrani.provider.game-code=${PROVIDER_GAME_CODE:BULLETRANI}
