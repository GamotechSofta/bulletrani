services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: bulletrani-backend:local
    container_name: bulletrani-backend
    ports:
      - "5000:5000"
      - "5001:5001"
    env_file:
      - .env
    environment:
      # Force bind inside the container (overrides host .env if needed)
      SOCKET_HOST: "0.0.0.0"
      SERVER_PORT: "5000"
      SOCKET_PORT: "5001"
    restart: unless-stopped
    # Atlas Mongo is external — no local mongo service required
